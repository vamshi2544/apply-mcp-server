spring:
  application:
    name: apply-mcp-server
  ai:
    mcp:
      server:
        name: apply-mcp-server
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE          # Streamable HTTP on a single endpoint
        streamable-http:
          mcp-endpoint: /mcp
        instructions: >
          Tools for credit card prequalification. The flow is: prequal_get_offers (soft credit inquiry,
          requires the applicant's explicit consent), then prequal_accept_offer (irreversible, requires the
          applicant's explicit choice of one offer), then prequal_get_application_status.
          Follow the nextStep field in every result. Never invent ids, never choose an offer for the applicant,
          and never ask for a full Social Security number.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

# Shown at GET /actuator/info so you can always check which backend is live.
info:
  prequal:
    backend: ${prequal.backend}

# ---------------------------------------------------------------------------
# BACKEND SWITCH
# prequal.backend decides which PrequalBackend bean is created at startup:
#   mock -> MockPrequalBackend  (in-memory, no network, default)
#   http -> HttpPrequalBackend  (real APIs through the gateway)
# Ways to set it, highest priority first:
#   1. Command line:     --prequal.backend=http
#   2. Environment var:  PREQUAL_BACKEND=http
#   3. Spring profile:   --spring.profiles.active=real   (see application-real.yml)
#   4. This file:        default below
# It is server configuration. It is never part of a tool call, so an AI agent cannot change it.
# ---------------------------------------------------------------------------
prequal:
  backend: ${PREQUAL_BACKEND:mock}
  http:
    base-url: ${PREQUAL_BASE_URL:}
    client-id: ${PREQUAL_CLIENT_ID:}
    api-key: ${PREQUAL_API_KEY:}
    channel: AI_AGENT
    connect-timeout: 2s
    read-timeout: 10s

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
